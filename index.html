<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/normalize.css">
  <link rel="stylesheet" href="./css/vars.css">
  <link rel="stylesheet" href="./css/settings.css">
  <link rel="stylesheet" href="./css/main.css">
  <title>Личный кабинет — DanabolClub</title>
</head>
<body>

  <!-- Хлебные крошки -->
  <div class="breadcrumbs">
    <div class="container">
      <ol class="breadcrumbs__list">
        <li class="breadcrumbs__item">
          <a href="#" class="breadcrumbs__link">Главная</a>
        </li>
        <li class="breadcrumbs__item breadcrumbs__item--current">
          <span>Кабинет клиента</span>
        </li>
      </ol>
    </div>
  </div>

  <!-- Кабинет клиента -->
  <section class="account">
    <div class="container">

      <h1 class="account__title">Кабинет клиента</h1>

      <div class="account__layout">

        <!-- Сайдбар -->
        <aside class="account__sidebar">
          <div class="account__sidebar-top">
            <h2 class="account__sidebar-role">Покупатель</h2>
          </div>

          <div class="account__balance">
            <div class="account__balance-inner">
              <span class="account__balance-label">Ваш баланс</span>
              <span class="account__balance-value">0 ₽</span>
            </div>
          </div>

          <div class="account__stats">
            <div class="account__stat">
              <span class="account__stat-label">Регистрация</span>
              <span class="account__stat-value">16.03.2026</span>
            </div>
            <div class="account__stat">
              <span class="account__stat-label">Успешных заказов</span>
              <span class="account__stat-value">0</span>
            </div>
            <div class="account__stat">
              <span class="account__stat-label">Общая сумма</span>
              <span class="account__stat-value">0</span>
            </div>
          </div>

          <button class="account__telegram-btn">Привязать свой Telegram</button>
        </aside>

        <!-- Основной контент -->
        <div class="account__content">
          <div class="account__content-header">
            <h2 class="account__content-title">Данные клиента</h2>
            <a href="#" class="account__logout">
              Выход
              <svg width="11" height="10" viewBox="0 0 11 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 5H10M10 5L6.5 1.5M10 5L6.5 8.5" stroke="#5A7085" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </a>
          </div>

          <div class="account__cards">

            <!-- Карточка 1: Изменить контактную информацию (активная) -->
            <a href="#" class="account__card account__card--active">
              <div class="account__card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="3" y="3" width="18" height="18" rx="2" stroke="white" stroke-width="1.5"/>
                  <line x1="7" y1="8" x2="17" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                  <line x1="7" y1="12" x2="13" y2="12" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                  <line x1="7" y1="16" x2="15" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </div>
              <span class="account__card-text">Изменить контактную информацию</span>
            </a>

            <!-- Карточка 2: История транзакций -->
            <a href="#" class="account__card">
              <div class="account__card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <ellipse cx="12" cy="5" rx="8" ry="3" stroke="white" stroke-width="1.5"/>
                  <path d="M4 5v5c0 1.66 3.58 3 8 3s8-1.34 8-3V5" stroke="white" stroke-width="1.5"/>
                  <path d="M4 10v5c0 1.66 3.58 3 8 3" stroke="white" stroke-width="1.5"/>
                  <path d="M17 15l2 2 4-4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <span class="account__card-text">История транзакций</span>
            </a>

            <!-- Карточка 3: Изменить мои адреса -->
            <a href="#" class="account__card">
              <div class="account__card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="12" r="9" stroke="white" stroke-width="1.5"/>
                  <ellipse cx="12" cy="12" rx="4" ry="9" stroke="white" stroke-width="1.5"/>
                  <line x1="3" y1="12" x2="21" y2="12" stroke="white" stroke-width="1.5"/>
                  <line x1="3" y1="8" x2="21" y2="8" stroke="white" stroke-width="1.5"/>
                  <line x1="3" y1="16" x2="21" y2="16" stroke="white" stroke-width="1.5"/>
                </svg>
              </div>
              <span class="account__card-text">Изменить мои адреса</span>
            </a>

            <!-- Карточка 4: Сообщения -->
            <a href="#" class="account__card">
              <div class="account__card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="6" cy="8" r="2" fill="white"/>
                  <circle cx="6" cy="12" r="2" fill="white"/>
                  <circle cx="6" cy="16" r="2" fill="white"/>
                  <line x1="10" y1="8" x2="19" y2="8" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                  <line x1="10" y1="12" x2="19" y2="12" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                  <line x1="10" y1="16" x2="19" y2="16" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </div>
              <span class="account__card-text">Сообщения</span>
            </a>

            <!-- Карточка 5: История заказов -->
            <a href="#" class="account__card">
              <div class="account__card-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M6 2L3 6V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V6L18 2H6Z" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
                  <line x1="3" y1="6" x2="21" y2="6" stroke="white" stroke-width="1.5"/>
                  <path d="M16 10C16 12.21 14.21 14 12 14C9.79 14 8 12.21 8 10" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </div>
              <span class="account__card-text">История заказов</span>
            </a>

          </div>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
